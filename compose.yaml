services:
  web:
    container_name: web
    build:
      context: .
      dockerfile: Dockerfile
    ports:
      - 3000:3000
    env_file:
      - path: .env
      - path: .env.local
        required: false
    environment:
      NODE_ENV: production
      # The Supabase CLI stack (`npm run db:start`) runs on the host, and
      # 127.0.0.1 inside this container is the container itself — go via the
      # host gateway instead. Set DOCKER_SUPABASE_URL to target another stack.
      SUPABASE_URL: ${DOCKER_SUPABASE_URL:-http://host.docker.internal:54321}
    extra_hosts:
      - host.docker.internal:host-gateway
