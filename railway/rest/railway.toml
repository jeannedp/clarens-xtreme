# PostgREST. Railway service name: rest
# Service settings → Config-as-code → Railway config file: /railway/rest/railway.toml

[build]
builder = "DOCKERFILE"
dockerfilePath = "railway/rest/Dockerfile"
watchPatterns = ["/railway/rest/**"]

[deploy]
restartPolicyType = "ON_FAILURE"
restartPolicyMaxRetries = 10
