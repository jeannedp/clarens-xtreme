# Next.js app. Railway service name: web
# Service settings → Config-as-code → Railway config file: /railway/web/railway.toml

[build]
builder = "DOCKERFILE"
dockerfilePath = "Dockerfile"
watchPatterns = [
  "/src/**",
  "/public/**",
  "/package.json",
  "/package-lock.json",
  "/next.config.ts",
  "/tsconfig.json",
  "/postcss.config.mjs",
  "/components.json",
  "/Dockerfile",
  "/supabase/config.toml",
  "/supabase/migrations/**",
  "/railway/web/**",
]

[deploy]
# Applies pending supabase/migrations to `db` (over the private network) before
# the new version goes live. If it fails, the deploy is aborted and the
# previous version keeps serving. Needs DATABASE_URL (see railway/README.md).
preDeployCommand = ["npm run db:migrate"]
healthcheckPath = "/api/health-check"
healthcheckTimeout = 120
restartPolicyType = "ON_FAILURE"
restartPolicyMaxRetries = 10
