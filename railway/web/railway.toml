# Next.js app. Railway service name: web
# Service settings → Config-as-code → Railway config file: /railway/web/railway.toml

[build]
builder = "DOCKERFILE"
dockerfilePath = "Dockerfile"
watchPatterns = [
  "/src/**",
  "/public/**",
  "/package.json",
  "/package-lock.json",
  "/next.config.ts",
  "/tsconfig.json",
  "/postcss.config.mjs",
  "/components.json",
  "/Dockerfile",
  "/railway/web/**",
]

[deploy]
healthcheckPath = "/api/health-check"
healthcheckTimeout = 120
restartPolicyType = "ON_FAILURE"
restartPolicyMaxRetries = 10
